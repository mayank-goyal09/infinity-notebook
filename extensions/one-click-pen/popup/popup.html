<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinity Pen</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-card">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            <path d="M2 2l7.586 7.586"/>
            <circle cx="11" cy="11" r="2"/>
          </svg>
        </div>
        <div>
          <h1 class="title">Infinity Pen</h1>
          <p class="subtitle">One-Click Screen Inking</p>
        </div>
      </div>
      <span class="badge">v1.0</span>
    </div>

    <div class="action-section">
      <button id="toggleBtn" class="primary-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <span>Toggle Inking Canvas</span>
        <kbd>Alt + P</kbd>
      </button>
    </div>

    <div class="features-list">
      <div class="feature-item">
        <span class="dot green"></span>
        <span>Hardware Pen Tablet Pressure</span>
      </div>
      <div class="feature-item">
        <span class="dot blue"></span>
        <span>Catmull-Rom Smooth Splines</span>
      </div>
      <div class="feature-item">
        <span class="dot purple"></span>
        <span>Screenshot & Annotate Anywhere</span>
      </div>
    </div>

    <div class="footer">
      <span>Works on any webpage • Press <b>Esc</b> to hide</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
