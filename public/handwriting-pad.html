<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Handwriting QuickPad</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #131c2e;
      --surface-border: #1e293b;
      --surface-hover: #1e2e4a;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --primary-btn: linear-gradient(135deg, #2563eb, #3b82f6);
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Control Header */
    header {
      height: 46px;
      background: var(--surface);
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .target-badge {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #7dd3fc;
      font-weight: 500;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: help;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    button {
      background: #1e293b;
      color: var(--text);
      border: 1px solid #334155;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #334155;
    }

    button:active {
      transform: scale(0.96);
    }

    button.btn-primary {
      background: var(--primary-btn);
      border: 1px solid #3b82f6;
      color: #fff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    button.btn-primary:hover {
      box-shadow: 0 3px 12px rgba(37, 99, 235, 0.5);
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    button.btn-danger:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    .toggle-label {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 4px;
    }

    .toggle-label:hover {
      color: var(--text);
    }

    .toggle-label input {
      accent-color: #38bdf8;
      cursor: pointer;
    }

    /* Inking Canvas Area */
    .canvas-container {
      flex: 1;
      position: relative;
      background: #060911;
      cursor: crosshair;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Subtle ruled lines guide overlay */
    .canvas-grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-size: 100% 36px;
      background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    }

    /* Auto-Paste Progress Countdown Bar */
    .progress-bar-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: transparent;
      pointer-events: none;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
      transition: width 0.05s linear;
    }

    /* Candidate Badges Bar */
    .candidates-bar {
      min-height: 32px;
      background: #0f172a;
      border-top: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      padding: 4px 10px;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .candidates-bar::-webkit-scrollbar {
      display: none;
    }

    .candidates-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .candidate-chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .candidate-chip:hover {
      background: #38bdf8;
      color: #04121d;
      border-color: #38bdf8;
      font-weight: 600;
    }

    .candidate-chip.primary {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-weight: 600;
    }

    /* Bottom Status & Preview Bar */
    footer {
      height: 38px;
      background: var(--surface);
      border-top: 1px solid var(--surface-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      flex-shrink: 0;
      gap: 12px;
    }

    .preview-box {
      flex: 1;
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .preview-placeholder {
      color: var(--text-muted);
      font-style: italic;
    }

    .status-indicator {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #64748b;
    }

    .status-dot.active {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .status-dot.success {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Toast Notification Banner */
    .toast {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: #10b981;
      color: white;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Header Controls -->
  <header>
    <div class="header-left">
      <div class="app-title">
        <span>✍️</span>
        <span>QuickPad</span>
      </div>
      <div class="target-badge" id="targetBadge" title="The window where your text will be pasted">
        <span>🎯</span>
        <span id="targetName">Active Window</span>
      </div>
    </div>

    <div class="header-actions">
      <label class="toggle-label" title="Automatically paste 750ms after you stop writing">
        <input type="checkbox" id="autoPasteToggle" checked>
        <span>Auto-paste</span>
      </label>
      <label class="toggle-label" title="Simulate Enter key after pasting to send chat message">
        <input type="checkbox" id="autoSendToggle">
        <span>Auto-send</span>
      </label>
      <button id="btnUndo" title="Undo last stroke (Ctrl+Z)">↩ Undo</button>
      <button class="btn-danger" id="btnClear" title="Clear canvas (Esc)">🧹 Clear</button>
      <button class="btn-primary" id="btnPaste" title="Convert handwriting and paste into active chat (Enter)">
        <span>✨ Paste</span>
      </button>
    </div>
  </header>

  <!-- Inking Canvas Container -->
  <div class="canvas-container" id="canvasContainer">
    <div class="canvas-grid"></div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    <canvas id="inkCanvas"></canvas>
  </div>

  <!-- Candidate Suggestions Bar -->
  <div class="candidates-bar" id="candidatesBar">
    <span class="candidates-label">Options:</span>
    <span style="font-size: 11px; color: var(--text-muted); font-style: italic;" id="candidatesPlaceholder">Write words, numbers, or sentences...</span>
    <div id="candidateChips" style="display: inline-flex; gap: 6px;"></div>
  </div>

  <!-- Bottom Preview & Status Bar -->
  <footer>
    <div class="preview-box" id="previewBox">
      <span class="preview-placeholder">Write anything above with your stylus, pen, or mouse...</span>
    </div>
    <div class="status-indicator">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Ready</span>
    </div>
  </footer>

  <!-- Temporary Toast Banner -->
  <div class="toast" id="toast">✓ Pasted into Claude!</div>

  <script>
    // Canvas & Context Setup
    const canvas = document.getElementById('inkCanvas');
    const container = document.getElementById('canvasContainer');
    const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });

    // UI Elements
    const previewBox = document.getElementById('previewBox');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const targetName = document.getElementById('targetName');
    const toast = document.getElementById('toast');
    const autoPasteToggle = document.getElementById('autoPasteToggle');
    const autoSendToggle = document.getElementById('autoSendToggle');
    const btnUndo = document.getElementById('btnUndo');
    const btnClear = document.getElementById('btnClear');
    const btnPaste = document.getElementById('btnPaste');
    const progressBarFill = document.getElementById('progressBarFill');
    const candidatesPlaceholder = document.getElementById('candidatesPlaceholder');
    const candidateChips = document.getElementById('candidateChips');

    // Drawing State
    let strokes = []; // Array of Stroke: { points: [{x, y, pressure, time}] }
    let currentStroke = null;
    let isDrawing = false;
    let autoPasteTimer = null;
    let countdownInterval = null;
    let isRecognizing = false;
    let currentCandidates = [];

    // Resize canvas with devicePixelRatio for Retina crispness
    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const rect = container.getBoundingClientRect();
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.scale(dpr, dpr);
      redrawAllStrokes();
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('DOMContentLoaded', resizeCanvas);

    // Redraw all accumulated strokes cleanly
    function redrawAllStrokes() {
      const rect = container.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      strokes.forEach(s => renderStroke(s.points));
      if (currentStroke) {
        renderStroke(currentStroke.points);
      }
    }

    // Render a single stroke with smooth quadratic curves
    function renderStroke(points) {
      if (!points || points.length === 0) return;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3.6;

      if (points.length === 1) {
        ctx.beginPath();
        ctx.arc(points[0].x, points[0].y, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();
        ctx.restore();
        return;
      }

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);

      for (let i = 1; i < points.length - 1; i++) {
        const xc = (points[i].x + points[i + 1].x) / 2;
        const yc = (points[i].y + points[i + 1].y) / 2;
        ctx.quadraticCurveTo(points[i].x, points[i].y, xc, yc);
      }

      const last = points[points.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      ctx.restore();
    }

    // High-Precision Pointer Events
    canvas.addEventListener('pointerdown', (e) => {
      canvas.setPointerCapture(e.pointerId);
      isDrawing = true;

      // Abort active countdown & paste timer
      cancelAutoPasteCountdown();

      const rect = canvas.getBoundingClientRect();
      const pt = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        pressure: e.pressure || 0.5,
        time: performance.now()
      };

      currentStroke = { points: [pt] };
      renderStroke(currentStroke.points);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDrawing || !currentStroke) return;

      const rect = canvas.getBoundingClientRect();
      // Use coalesced events if hardware pen supplies high-frequency sub-frame points
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];

      for (const ev of events) {
        currentStroke.points.push({
          x: ev.clientX - rect.left,
          y: ev.clientY - rect.top,
          pressure: ev.pressure || 0.5,
          time: performance.now()
        });
      }

      redrawAllStrokes();
    });

    // Douglas-Peucker point simplification algorithm
    function simplifyPoints(points, tolerance = 1.0) {
      if (points.length <= 2) return points;
      let maxDist = 0;
      let maxIndex = 0;
      const first = points[0];
      const last = points[points.length - 1];

      for (let i = 1; i < points.length - 1; i++) {
        const p = points[i];
        const dist = perpendicularDist(p, first, last);
        if (dist > maxDist) {
          maxDist = dist;
          maxIndex = i;
        }
      }

      if (maxDist > tolerance) {
        const left = simplifyPoints(points.slice(0, maxIndex + 1), tolerance);
        const right = simplifyPoints(points.slice(maxIndex), tolerance);
        return left.slice(0, -1).concat(right);
      } else {
        return [first, last];
      }
    }

    function perpendicularDist(p, start, end) {
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const mag = Math.hypot(dx, dy);
      if (mag === 0) return Math.hypot(p.x - start.x, p.y - start.y);
      return Math.abs(dy * p.x - dx * p.y + end.x * start.y - end.y * start.x) / mag;
    }

    const finishStroke = () => {
      if (!isDrawing) return;
      isDrawing = false;
      if (currentStroke && currentStroke.points.length > 0) {
        // Decimate redundant points to keep payload snappy while preserving geometry
        if (currentStroke.points.length > 8) {
          currentStroke.points = simplifyPoints(currentStroke.points, 1.0);
        }
        strokes.push(currentStroke);
        currentStroke = null;
      }

      // Pre-fetch live recognition candidates
      fetchCandidatesOnly();

      // If Auto-Paste is enabled, trigger countdown
      if (autoPasteToggle.checked && strokes.length > 0) {
        startAutoPasteCountdown(750);
      }
    };

    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', finishStroke);

    function startAutoPasteCountdown(durationMs) {
      cancelAutoPasteCountdown();
      const startTime = performance.now();

      countdownInterval = setInterval(() => {
        const elapsed = performance.now() - startTime;
        const progress = Math.min(100, (elapsed / durationMs) * 100);
        progressBarFill.style.width = `${progress}%`;
      }, 25);

      autoPasteTimer = setTimeout(() => {
        cancelAutoPasteCountdown();
        triggerRecognizeAndPaste();
      }, durationMs);
    }

    function cancelAutoPasteCountdown() {
      if (autoPasteTimer) {
        clearTimeout(autoPasteTimer);
        autoPasteTimer = null;
      }
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      progressBarFill.style.width = '0%';
    }

    // Undo Last Stroke
    function undoStroke() {
      cancelAutoPasteCountdown();
      if (strokes.length > 0) {
        strokes.pop();
        redrawAllStrokes();
        if (strokes.length > 0) {
          fetchCandidatesOnly();
          if (autoPasteToggle.checked) {
            startAutoPasteCountdown(750);
          }
        } else {
          clearCandidates();
          previewBox.innerHTML = '<span class="preview-placeholder">Write anything above with your stylus, pen, or mouse...</span>';
          setStatus('ready', 'Ready');
        }
      }
    }

    btnUndo.addEventListener('click', undoStroke);

    // Clear Canvas
    function clearCanvas() {
      cancelAutoPasteCountdown();
      strokes = [];
      currentStroke = null;
      redrawAllStrokes();
      clearCandidates();
      previewBox.innerHTML = '<span class="preview-placeholder">Write anything above with your stylus, pen, or mouse...</span>';
      setStatus('ready', 'Ready');
    }

    function clearCandidates() {
      currentCandidates = [];
      candidateChips.innerHTML = '';
      candidatesPlaceholder.style.display = 'inline';
    }

    btnClear.addEventListener('click', clearCanvas);

    // Keyboard Shortcuts (Esc to clear, Ctrl+Z to undo, Enter to Paste)
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        clearCanvas();
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        undoStroke();
      } else if (e.key === 'Enter') {
        cancelAutoPasteCountdown();
        triggerRecognizeAndPaste();
      }
    });

    btnPaste.addEventListener('click', () => {
      cancelAutoPasteCountdown();
      triggerRecognizeAndPaste();
    });

    function setStatus(type, msg) {
      statusText.textContent = msg;
      statusDot.className = 'status-dot ' + (type === 'active' ? 'active' : (type === 'success' ? 'success' : ''));
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Google Handwriting InputTools Format Helper
    function formatStrokesForAPI(strokeList) {
      let minX = Infinity, minY = Infinity;
      strokeList.forEach(s => {
        s.points.forEach(pt => {
          minX = Math.min(minX, pt.x);
          minY = Math.min(minY, pt.y);
        });
      });

      const baseTime = strokeList[0]?.points[0]?.time || performance.now();
      let currentTime = 0;

      return strokeList.map(s => {
        const xs = [], ys = [], ts = [];
        s.points.forEach((pt, idx) => {
          xs.push(Math.round(pt.x - minX + 20));
          ys.push(Math.round(pt.y - minY + 20));
          let t = Math.round(pt.time - baseTime);
          if (t <= currentTime && idx > 0) t = currentTime + 16;
          currentTime = t;
          ts.push(t);
        });
        currentTime += 50;
        return [xs, ys, ts];
      });
    }

    // Lightweight live pre-fetch for alternate candidates
    async function fetchCandidatesOnly() {
      if (strokes.length === 0) return;
      const inkPayload = formatStrokesForAPI(strokes);
      const requestBody = {
        options: 'enable_pre_space',
        requests: [
          {
            writing_guide: { writing_area_width: 800, writing_area_height: 400 },
            ink: inkPayload,
            language: 'en'
          }
        ]
      };

      try {
        const res = await fetch(
          'https://www.google.com/inputtools/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
          }
        );
        if (!res.ok) return;
        const data = await res.json();
        if (data && data[0] === 'SUCCESS' && data[1]?.[0]?.[1]) {
          currentCandidates = data[1][0][1] || [];
          renderCandidateChips(currentCandidates);
        }
      } catch {}
    }

    function renderCandidateChips(candidates) {
      if (!candidates || candidates.length === 0) {
        clearCandidates();
        return;
      }

      candidatesPlaceholder.style.display = 'none';
      candidateChips.innerHTML = '';

      candidates.slice(0, 5).forEach((cand, idx) => {
        const chip = document.createElement('div');
        chip.className = 'candidate-chip' + (idx === 0 ? ' primary' : '');
        chip.textContent = cand;
        chip.title = `Click to immediately paste "${cand}"`;
        chip.addEventListener('click', () => {
          cancelAutoPasteCountdown();
          previewBox.textContent = `"${cand}"`;
          pasteTextToActiveApp(cand).then(() => clearCanvas());
        });
        candidateChips.appendChild(chip);
      });

      if (candidates[0]) {
        previewBox.textContent = `"${candidates[0]}"`;
      }
    }

    // Recognize Handwriting & Trigger OS Paste
    async function triggerRecognizeAndPaste(overrideText) {
      if (strokes.length === 0 || isRecognizing) return;

      if (overrideText && overrideText.trim().length > 0) {
        previewBox.textContent = `"${overrideText}"`;
        await pasteTextToActiveApp(overrideText);
        clearCanvas();
        return;
      }

      isRecognizing = true;
      setStatus('active', 'Recognizing...');

      const inkPayload = formatStrokesForAPI(strokes);
      const requestBody = {
        options: 'enable_pre_space',
        requests: [
          {
            writing_guide: { writing_area_width: 800, writing_area_height: 400 },
            ink: inkPayload,
            language: 'en'
          }
        ]
      };

      try {
        const response = await fetch(
          'https://www.google.com/inputtools/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(requestBody)
          }
        );

        if (!response.ok) throw new Error('API request failed');
        const data = await response.json();

        if (data && data[0] === 'SUCCESS' && data[1]?.[0]?.[1]) {
          const candidates = data[1][0][1] || [];
          const transcribedText = candidates[0] || '';
          if (transcribedText.trim().length > 0) {
            previewBox.textContent = `"${transcribedText}"`;
            await pasteTextToActiveApp(transcribedText);
            clearCanvas();
            return;
          }
        }

        setStatus('ready', 'No text detected');
      } catch (err) {
        console.error('Recognition error:', err);
        setStatus('ready', 'Recognition error');
      } finally {
        isRecognizing = false;
      }
    }

    // Deliver text to the active application (via Python companion or local clipboard)
    async function pasteTextToActiveApp(text) {
      setStatus('active', 'Pasting...');
      const autoSend = autoSendToggle.checked;

      // Try communicating with local Python bridge server on port 48123
      try {
        const res = await fetch('http://127.0.0.1:48123/api/paste', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, autoSend })
        });

        if (res.ok) {
          const result = await res.json();
          showToast(`✓ Pasted into ${result.targetTitle || 'Chat'}!`);
          setStatus('success', 'Pasted');
          return;
        }
      } catch (e) {
        // Fallback: If companion Python script is not running, copy directly to system clipboard
        try {
          await navigator.clipboard.writeText(text);
          showToast(`✓ Copied to Clipboard! (Press Ctrl+V to paste)`);
          setStatus('success', 'Copied');
        } catch (clipErr) {
          showToast(`Text: ${text}`);
        }
      }
    }

    // Poll companion bridge to see what window is currently targeted
    async function checkActiveWindow() {
      try {
        const res = await fetch('http://127.0.0.1:48123/api/status');
        if (res.ok) {
          const data = await res.json();
          if (data.targetTitle) {
            targetName.textContent = data.targetTitle;
            targetName.title = data.targetTitle;
          }
        }
      } catch {}
    }

    setInterval(checkActiveWindow, 1200);
    checkActiveWindow();
  </script>
</body>
</html>
