<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with safe zone -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- Subtle page grid background pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1.5">
    <line x1="96" y1="128" x2="416" y2="128"/>
    <line x1="96" y1="192" x2="416" y2="192"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="320" x2="416" y2="320"/>
    <line x1="96" y1="384" x2="416" y2="384"/>
    <line x1="160" y1="96" x2="160" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="352" y1="96" x2="352" y2="416"/>
  </g>

  <!-- Glowing Infinity Loop -->
  <path d="M 180 200 C 130 200, 100 225, 100 256 C 100 287, 130 312, 180 312 C 235 312, 275 256, 332 256 C 382 256, 412 281, 412 256 C 412 231, 382 200, 332 200 C 275 200, 235 312, 180 312" 
        fill="none" 
        stroke="url(#accent)" 
        stroke-width="28" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Pen Nib accent at intersection -->
  <path d="M 256 160 L 272 195 L 256 220 L 240 195 Z" fill="#38bdf8"/>
  <circle cx="256" cy="195" r="3" fill="#09090b"/>
  <line x1="256" y1="195" x2="256" y2="220" stroke="#09090b" stroke-width="2"/>
</svg>
