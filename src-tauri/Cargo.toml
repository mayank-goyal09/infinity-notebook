[package]
name = "infinity-notebook"
version = "2.0.0"
description = "Production-quality, local-first note-taking app with endless pages and infinite canvas"
authors = ["Infinity Notebook Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
